<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahla, assistante Sehelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ciel: #30A9DE; --navy: #212967; --conf: #0E70D7;
    --fond: #F5F3EC; --texte2: #3B4370; --texte3: #565F86; --bord: #E9E6DB; --blanc: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fond); color: var(--navy);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 440px; height: 100dvh; display: flex; flex-direction: column; background: var(--fond); }
  @media (min-width: 520px) {
    body { align-items: center; }
    .app { height: min(860px, 96dvh); border-radius: 32px; overflow: hidden; border: 1px solid var(--bord); box-shadow: 0 24px 64px rgba(33, 41, 103, 0.12); }
  }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; background: var(--blanc); border-bottom: 1px solid var(--bord); }
  .avatar { width: 56px; height: 56px; flex-shrink: 0; }
  .marque { font-size: 24px; font-weight: 700; font-style: italic; letter-spacing: -0.5px; line-height: 1; direction: ltr; }
  .statut { font-size: 13px; color: var(--texte3); margin-top: 4px; min-height: 1em; }
  .outils { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--texte3); border: 1px solid var(--bord); border-radius: 999px; padding: 3px 8px; }
  select { font: inherit; font-size: 13px; color: var(--navy); background: var(--fond); border: 1px solid var(--bord); border-radius: 10px; padding: 6px 4px; max-width: 110px; }
  .icone { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--bord); background: var(--blanc); color: var(--navy); display: grid; place-items: center; cursor: pointer; }
  #fil { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .accueil { text-align: center; padding: 4px 8px 8px; }
  .accueil h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.3px; }
  .accueil p { color: var(--texte2); font-size: 15px; line-height: 1.5; margin: 0 auto 16px; max-width: 320px; }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .puce { font: inherit; font-size: 14px; color: var(--navy); background: var(--blanc); border: 1px solid var(--bord); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
  .puce:hover, .icone:hover { border-color: var(--ciel); }
  .bulle { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
  .bulle p { margin: 0; }
  .bulle p + p, .bulle ul + p, .bulle p + ul { margin-top: 6px; }
  .bulle ul { margin: 4px 0; padding-inline-start: 20px; }
  .moi { align-self: flex-end; background: var(--navy); color: var(--blanc); border-end-end-radius: 6px; white-space: pre-wrap; }
  .sahla { align-self: flex-start; background: var(--blanc); border: 1px solid var(--bord); border-end-start-radius: 6px; }
  .sahla.erreur { color: var(--texte2); font-style: italic; }
  .action { align-self: flex-start; font: inherit; font-weight: 600; font-size: 15px; color: var(--blanc); background: var(--conf); border: none; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  .points { display: inline-flex; gap: 4px; padding: 4px 0; }
  .points span { width: 7px; height: 7px; border-radius: 50%; background: var(--ciel); animation: rebond 1s infinite ease-in-out; }
  .points span:nth-child(2) { animation-delay: 0.15s; background: var(--conf); }
  .points span:nth-child(3) { animation-delay: 0.3s; background: var(--navy); }
  @keyframes rebond { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-5px); opacity: 1; } }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; background: var(--blanc); border-top: 1px solid var(--bord); }
  textarea { flex: 1; resize: none; font: inherit; font-size: 15px; color: var(--navy); background: var(--fond); border: 1px solid var(--bord); border-radius: 22px; padding: 11px 16px; max-height: 120px; outline: none; }
  textarea:focus { border-color: var(--ciel); }
  .envoyer { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--conf); color: var(--blanc); display: grid; place-items: center; cursor: pointer; }
  .envoyer:disabled { background: var(--bord); cursor: default; }
  [dir="rtl"] .envoyer svg, [dir="rtl"] .icone svg { transform: scaleX(-1); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: min(400px, 90vw); background: var(--navy); color: var(--blanc); padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; box-shadow: 0 8px 24px rgba(33, 41, 103, 0.25); }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="avatar" id="avatar"></div>
    <div>
      <div class="marque"><span style="color: var(--navy)">Sa</span><span style="color: var(--conf)">h</span><span style="color: var(--ciel)">la</span></div>
      <div class="statut" id="statut"></div>
    </div>
    <div class="outils">
      <span class="badge" id="badge-demo" hidden>DÉMO</span>
      <select id="langue" aria-label="Langue"></select>
      <button class="icone" id="nouvelle" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>
  <main id="fil" aria-live="polite"></main>
  <form id="formulaire">
    <textarea id="saisie" rows="1" maxlength="2000"></textarea>
    <button class="envoyer" id="envoyer" type="submit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<script type="module">
  import { sahlaSvg } from "./sahla.js";
  import { TEXTES, LANGUES_RTL } from "./textes.js";

  const $ = (id) => document.getElementById(id);
  const fil = $("fil"), saisie = $("saisie"), selectLangue = $("langue");

  const lire = (cle) => { try { return localStorage.getItem(cle); } catch { return null; } };
  const ecrire = (cle, val) => { try { localStorage.setItem(cle, val); } catch {} };

  const navigateur = (navigator.language || "fr").slice(0, 2);
  const etat = {
    langue: TEXTES[lire("sahla.langue")] ? lire("sahla.langue") : TEXTES[navigateur] ? navigateur : "fr",
    conversationId: null,
    enCours: false,
    pose: null,
    vide: true,
  };
  const t = () => TEXTES[etat.langue];
  const POINTS = '<span class="points"><span></span><span></span><span></span></span>';

  for (const [code, textes] of Object.entries(TEXTES)) {
    selectLangue.add(new Option(textes.nom, code, false, code === etat.langue));
  }

  function poser(pose) {
    if (pose !== etat.pose) {
      etat.pose = pose;
      $("avatar").innerHTML = sahlaSvg(pose, { taille: 56, label: t().poses[pose] });
    }
    $("statut").textContent = pose === "hello" ? t().sousTitre : t().poses[pose];
  }

  function accueil() {
    fil.innerHTML = "";
    const bloc = document.createElement("section");
    bloc.className = "accueil";
    bloc.innerHTML = `${sahlaSvg("hello", { taille: 180 })}<h1></h1><p></p><div class="puces"></div>`;
    bloc.querySelector("h1").textContent = t().titre;
    bloc.querySelector("p").textContent = t().intro;
    for (const s of t().suggestions) {
      const puce = document.createElement("button");
      puce.className = "puce";
      puce.type = "button";
      puce.textContent = s;
      puce.onclick = () => envoyer(s);
      bloc.querySelector(".puces").append(puce);
    }
    fil.append(bloc);
    etat.vide = true;
  }

  function appliquerLangue() {
    document.documentElement.lang = etat.langue;
    $("app").dir = LANGUES_RTL.has(etat.langue) ? "rtl" : "ltr";
    saisie.placeholder = t().saisie;
    $("envoyer").setAttribute("aria-label", t().envoyer);
    $("nouvelle").title = t().nouvelle;
    $("nouvelle").setAttribute("aria-label", t().nouvelle);
    poser(etat.pose ?? "hello");
    if (etat.vide) accueil();
  }

  // Rendu minimal : **gras**, listes à tirets ou numérotées, paragraphes.
  function rendre(texte) {
    const echappe = texte.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    let html = "", liste = false;
    for (const ligne of echappe.split("\n")) {
      const puce = ligne.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)$/);
      if (puce) { if (!liste) { html += "<ul>"; liste = true; } html += `<li>${puce[1]}</li>`; continue; }
      if (liste) { html += "</ul>"; liste = false; }
      if (ligne.trim()) html += `<p>${ligne}</p>`;
    }
    if (liste) html += "</ul>";
    return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function bulle(classe, texte = "") {
    const b = document.createElement("div");
    b.className = `bulle ${classe}`;
    if (texte) b.textContent = texte;
    fil.append(b);
    fil.scrollTop = fil.scrollHeight;
    return b;
  }

  function toast(message) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.append(el);
    setTimeout(() => el.remove(), 4000);
  }

  function boutonAction(action) {
    const bouton = document.createElement("button");
    bouton.className = "action";
    bouton.type = "button";
    bouton.textContent = action.libelle;
    bouton.onclick = () => {
      const params = Object.entries(action.parametres || {}).map(([k, v]) => `${k}=${v}`).join(", ");
      toast(`Dans l'app Sehelli, ce bouton ouvrirait l'écran « ${action.ecran} »${params ? ` (${params})` : ""}.`);
      // Démo : l'app signalerait la confirmation, et Sahla fête ça.
      poser("bravo");
      setTimeout(() => !etat.enCours && poser("hello"), 2800);
    };
    fil.append(bouton);
    fil.scrollTop = fil.scrollHeight;
  }

  async function* lireSse(reponse) {
    const lecteur = reponse.body.pipeThrough(new TextDecoderStream()).getReader();
    let tampon = "";
    for (;;) {
      const { value, done } = await lecteur.read();
      if (done) return;
      tampon += value;
      let fin;
      while ((fin = tampon.indexOf("\n\n")) >= 0) {
        const bloc = tampon.slice(0, fin);
        tampon = tampon.slice(fin + 2);
        let evenement = "message", donnees = "";
        for (const ligne of bloc.split("\n")) {
          if (ligne.startsWith("event: ")) evenement = ligne.slice(7);
          else if (ligne.startsWith("data: ")) donnees += ligne.slice(6);
        }
        if (donnees) yield { evenement, donnees: JSON.parse(donnees) };
      }
    }
  }

  async function envoyer(texte) {
    texte = texte.trim();
    if (!texte || etat.enCours) return;
    if (etat.vide) { fil.innerHTML = ""; etat.vide = false; }
    etat.enCours = true;
    $("envoyer").disabled = true;
    bulle("moi", texte);
    const reponseBulle = bulle("sahla");
    reponseBulle.innerHTML = POINTS;
    poser("search");
    let brut = "";
    const erreur = (code) => {
      reponseBulle.classList.add("erreur");
      reponseBulle.textContent = t().erreurs[code] ?? t().erreurs.indisponible;
      poser("oops");
    };

    try {
      const reponse = await fetch("/v1/sahla/message", {
        method: "POST",
        // Jeton fictif : simule un utilisateur connecté pour la démo.
        headers: { "Content-Type": "application/json", Authorization: "Bearer demo-web" },
        body: JSON.stringify({
          conversation_id: etat.conversationId ?? undefined,
          message: texte,
          langue: etat.langue,
          canal: "texte",
          contexte: { ecran: "demo_web" },
        }),
      });
      if (!reponse.ok) {
        const corps = await reponse.json().catch(() => ({}));
        return erreur(corps.erreur);
      }
      for await (const { evenement, donnees } of lireSse(reponse)) {
        switch (evenement) {
          case "debut": etat.conversationId = donnees.conversation_id; break;
          case "texte": brut += donnees.delta; reponseBulle.innerHTML = rendre(brut); break;
          case "remplacer": brut = donnees.texte; reponseBulle.innerHTML = brut ? rendre(brut) : POINTS; break;
          case "pose": poser(donnees.pose); break;
          case "action": boutonAction(donnees.action); break;
          case "fin": poser(donnees.pose); etat.conversationId = donnees.conversation_id; break;
          case "erreur": erreur(donnees.code); break;
        }
        fil.scrollTop = fil.scrollHeight;
      }
      if (!brut && !reponseBulle.classList.contains("erreur")) erreur("indisponible");
    } catch {
      erreur("reseau");
    } finally {
      etat.enCours = false;
      $("envoyer").disabled = false;
    }
  }

  $("formulaire").addEventListener("submit", (e) => {
    e.preventDefault();
    const texte = saisie.value;
    saisie.value = "";
    saisie.style.height = "";
    envoyer(texte);
  });
  saisie.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("formulaire").requestSubmit(); }
  });
  saisie.addEventListener("input", () => { saisie.style.height = ""; saisie.style.height = `${saisie.scrollHeight}px`; });
  selectLangue.addEventListener("change", () => { etat.langue = selectLangue.value; ecrire("sahla.langue", etat.langue); appliquerLangue(); });
  $("nouvelle").addEventListener("click", () => {
    if (etat.enCours) return;
    if (etat.conversationId) fetch(`/v1/sahla/conversations/${etat.conversationId}`, { method: "DELETE", headers: { Authorization: "Bearer demo-web" } }).catch(() => {});
    etat.conversationId = null;
    poser("hello");
    accueil();
  });

  fetch("/sante").then((r) => r.json()).then((s) => { $("badge-demo").hidden = s.backend !== "démo"; }).catch(() => {});
  appliquerLangue();
</script>
</body>
</html>
